<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your MeExercise password</h1>
    <p>A password reset was requested for your MeExercise account.</p>
    <p>
      <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/auth/update-password">
        Choose a new password
      </a>
    </p>
    <p>If you did not request this change, you can ignore this message.</p>
  </body>
</html>
