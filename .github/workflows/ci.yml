name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  database:
    name: Database and auth integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: |
          if ! npm run supabase:start >/tmp/meexercise-supabase-start.log 2>&1; then
            echo "Supabase local stack failed to start."
            exit 1
          fi

      - name: Write local application environment
        run: node scripts/write-local-supabase-env.mjs

      - name: Replay migrations and synthetic seed
        run: npm run db:reset

      - name: Run pgTAP database tests
        run: npm run test:db

      - name: Run auth and profile integration
        run: npm run test:e2e:auth

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
